version = 1

# Files that cannot carry an inline comment header (JSON, lockfiles, config, Markdown, CI).
[[annotations]]
path = [
  "*.json",
  "**/*.json",
  "*.md",
  "**/*.md",
  "*.yaml",
  "**/*.yaml",
  "*.yml",
  "**/*.yml",
  "*.toml",
  "**/*.toml",
  ".gitignore",
  ".editorconfig",
  ".nvmrc",
  ".prettierignore",
  "LICENSE",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 MesTTo"
SPDX-License-Identifier = "MIT"

# The Hyperon oracle corpus and its expected output are derived from hyperon-experimental (MIT).
[[annotations]]
path = ["corpus/EXPECTED.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 TrueAGI Inc. and the hyperon-experimental contributors"
SPDX-License-Identifier = "MIT"

# Pure MeTTa library sources are generated back into runtime strings, so they cannot carry inline headers.
# They are ports of Patrick Hammer's PeTTa lib/lib_*.metta set; roman is Roman Treutlein's PeTTa prelude.
[[annotations]]
path = ["packages/libraries/src/roman/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = [
  "2025 Roman Treutlein — PeTTa (https://github.com/trueagi-io/PeTTa)",
  "2026 MesTTo — MeTTa-TS adaptation",
]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  "packages/libraries/src/vector/**",
  "packages/libraries/src/combinatorics/**",
  "packages/libraries/src/patrick/**",
  "packages/libraries/src/datastructures/**",
  "packages/libraries/src/spaces/**",
  "packages/libraries/src/nars/**",
  "packages/libraries/src/pln/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = [
  "2025 Patrick Hammer — PeTTa (https://github.com/trueagi-io/PeTTa)",
  "2026 MesTTo — MeTTa-TS adaptation",
]
SPDX-License-Identifier = "MIT"

# @metta-ts/py interop parity fixtures and binary docs-site assets carry no inline header.
[[annotations]]
path = ["packages/py/corpus/**", "website/public/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 MesTTo"
SPDX-License-Identifier = "MIT"

# PeTTa's own sources vendored by @mettascript/petta: its MeTTa libraries, which the engine loads, and the ee5cacb
# example corpus with the oracle records of PeTTa's runs, which the alignment harness compares against.
[[annotations]]
path = ["packages/petta/lib/**", "packages/petta/corpus/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Patrick Hammer and the PeTTa contributors — PeTTa (https://github.com/trueagi-io/PeTTa)"
SPDX-License-Identifier = "MIT"

# PeTTa's own Prolog source at ee5cacb, which the hosted engine consults and runs as its semantics.
[[annotations]]
path = ["packages/petta/petta-src/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Patrick Hammer and the PeTTa contributors — PeTTa (https://github.com/trueagi-io/PeTTa)"
SPDX-License-Identifier = "MIT"

# SWI-Prolog 10.1 library sources the hosted engine autoloads; each file keeps its own BSD-2-Clause header.
[[annotations]]
path = ["packages/petta/swipl/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "SWI-Prolog authors: University of Amsterdam, VU University Amsterdam, CWI Amsterdam and SWI-Prolog Solutions b.v."
SPDX-License-Identifier = "BSD-2-Clause"
